name: CI

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpcs:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: cs2pr

      - name: Install PHPCS + WPCS
        run: |
          composer global config --no-plugins allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --no-interaction --no-progress \
            squizlabs/php_codesniffer wp-coding-standards/wpcs

      # phpcs.xml pins extensions to php, so this never wanders into other file types.
      - name: Run PHPCS
        run: $(composer global config bin-dir --absolute)/phpcs -q --report=checkstyle . | cs2pr

  eslint:
    name: JS coding standards and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dev dependencies
        run: npm ci --no-fund --no-audit

      - name: Run ESLint
        run: npm run lint:js

      # vitest + jsdom, loading the plugin's scripts the way the browser does.
      # No build step: the scripts ship to users exactly as they are in js/.
      - name: Run JS tests
        run: npm run test:js

  phpunit:
    name: PHPUnit (WP ${{ matrix.wordpress }}, PHP ${{ matrix.php }}, ${{ matrix.multisite && 'multisite' || 'single site' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every supported stack, in both modes. Six rows, no special cases.
        #
        # Multisite is not a spare wheel: uninstall.php branches on
        # is_multisite(), and network-activated plugins are read from a site
        # option the single-site run never touches. It runs on the FLOOR too,
        # rather than on latest alone, which would test it where it is least
        # likely to fail. What actually breaks there: activation and uninstall
        # walking only the first 100 sites, because that is the default limit
        # of the site queries; switch_to_blog() stacks left unwound; custom
        # tables not registered with $wpdb inside a switch; and capabilities
        # that mean something different on a network, which is what the first
        # multisite run of this collection failed on in five plugins.
        include:
          - php: '8.2'
            wordpress: '6.8'
          - php: '8.2'
            wordpress: '6.8'
            multisite: true
          - php: '8.2'
            wordpress: 'latest'
          - php: '8.2'
            wordpress: 'latest'
            multisite: true
          - php: '8.5'
            wordpress: 'latest'
          - php: '8.5'
            wordpress: 'latest'
            multisite: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The runner already has Docker, which is all wp-env needs, so CI runs the
      # same stack as bin/test.sh does locally -- one code path, no drift.
      - name: Start wp-env
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}
          WP_ENV_CORE: ${{ matrix.wordpress == 'latest' && 'WordPress/WordPress' || format('WordPress/WordPress#{0}', matrix.wordpress) }}
        run: npx --yes @wordpress/env start

      - name: Install dev dependencies
        run: |
          npx --yes @wordpress/env run tests-cli --env-cwd=wp-content/plugins/wp-sweep \
            composer install --no-interaction --no-progress

      # The multisite config sets WP_MULTISITE for the WordPress test bootstrap,
      # so the mode is chosen by the config file rather than by the environment.
      - name: Run PHPUnit
        run: |
          npx --yes @wordpress/env run tests-cli --env-cwd=wp-content/plugins/wp-sweep \
            vendor/bin/phpunit -c ${{ matrix.multisite && 'phpunit-multisite.xml.dist' || 'phpunit.xml.dist' }}
